name: ghostlite live

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: ghostlite-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout runner
        uses: actions/checkout@v4

      - name: fetch private code
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            rm -rf ghostlite
            git clone "https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/ghostlite.git" ghostlite
            echo "SRC=ghostlite" >> "$GITHUB_ENV"
          else
            echo "SRC=." >> "$GITHUB_ENV"
          fi

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.SRC }}/requirements.txt

      - name: install deps
        run: pip install -r "$SRC/requirements.txt"

      - name: run ghostlite
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          cd "$SRC"
          timeout 20400s python main.py || true

      - name: chain restart
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo "$GITHUB_REPOSITORY"
